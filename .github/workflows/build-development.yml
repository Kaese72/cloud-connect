name: Create and publish Docker images

on:
  push:
    branches: ["master"]

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - context: server
            image: ghcr.io/${{ github.repository }}-server-development
          - context: client
            image: ghcr.io/${{ github.repository }}-client-development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: previoustag
        id: previoustag
        uses: "WyriHaximus/github-action-get-previous-tag@v1"

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.previoustag.outputs.tag }}-{{date 'YYYYMMDDHHmmss'}}-{{sha}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  trigger-renovate-in-gitops-repo:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run renovate.yml --ref master --repo Kaese72/huemie-gitops-base
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
